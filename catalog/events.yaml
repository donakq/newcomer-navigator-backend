# TODO(content): placeholder — replace with team-verified content
# Events the chat can recognize. See design doc: Task Catalog Schema.
- id: ARRIVED_US
  description: The student has arrived in the US.
  profile_updates: {in_us: true}
  extract_fields: [arrival_date]
- id: GOT_JOB_OFFER
  description: The student got, or is about to start, a job.
  profile_updates: {has_job_offer: true}
  extract_fields: [job_type]
- id: GOT_SSN
  description: The student received their SSN.
  profile_updates: {has_ssn: true}
- id: GOT_PHONE
  description: The student now has a US phone number.
  profile_updates: {has_us_phone: true}
- id: OPENED_BANK_ACCOUNT
  description: The student opened a US bank account.
  profile_updates: {has_bank_account: true}
