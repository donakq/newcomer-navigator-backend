<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newcomer Navigator Demo</title>
<!-- Mock frontend: a minimal UI that calls the backend API. The real frontend replaces this folder. -->
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1f; --muted:#6b6b6b; --line:#e3e3e0; --accent:#2563eb; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --text:#ececec; --muted:#9a9a9a; --line:#333; --accent:#60a5fa; --warn:#f59e0b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width: 900px) { main { grid-template-columns: 320px 1fr; } #chat-card { grid-column: 1 / -1; } }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
  .sub { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  select, input[type=text], textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  textarea { width:100%; min-height:60px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:6px 12px; }
  button.ghost { background:transparent; color:var(--accent); }
  .task { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .task.active { border-color:var(--accent); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar > div { height:100%; background:var(--accent); }
  .tag { font-size:12px; color:var(--warn); }
  .step { border-top:1px solid var(--line); padding:10px 0; }
  .step a { color:var(--accent); font-size:13px; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:13px; }
  .msg { margin:6px 0; } .msg b { color:var(--muted); font-weight:500; }
  .error { color:#dc2626; font-size:13px; }
</style>
</head>
<body>
<main>
  <div style="grid-column:1/-1">
    <h1>Newcomer Navigator</h1>
    <div class="sub">Mock 前端 · 内容为占位示例，未经核实 · <a id="docs-link" href="#">API docs</a></div>
  </div>

  <section class="card">
    <h2>1. 你的情况</h2>
    <form id="profile-form"></form>
    <button id="save-profile" style="margin-top:8px">保存并生成清单</button>
    <div id="profile-error" class="error"></div>
  </section>

  <section class="card">
    <h2>2. 你的待办清单</h2>
    <div id="checklist" class="sub">先在左边填写情况。</div>
    <div id="detail"></div>
  </section>

  <section class="card" id="chat-card">
    <h2>3. 问问助手</h2>
    <div id="chat-log"></div>
    <textarea id="chat-input" placeholder="例如：我下个月开始在图书馆打工"></textarea>
    <button id="chat-send" style="margin-top:8px">发送</button>
  </section>
</main>

<script src="config.js"></script>
<script>
document.getElementById("docs-link").href = API_BASE + "/docs";
const QUESTIONS = [
  ["in_us", "已经到美国了吗？", "bool"],
  ["has_us_phone", "有美国手机号吗？", "bool"],
  ["has_bank_account", "有美国银行账户吗？", "bool"],
  ["has_job_offer", "有工作 offer 吗？", "bool"],
  ["job_type", "工作类型", ["on_campus", "CPT", "OPT"]],
  ["has_ssn", "有 SSN 吗？", "bool"],
];

function getUserId() {
  let id = null;
  try { id = localStorage.getItem("nn_user_id"); } catch (e) {}
  if (!id) {
    id = crypto.randomUUID();
    try { localStorage.setItem("nn_user_id", id); } catch (e) {}
  }
  return id;
}
const USER_ID = getUserId();

async function api(method, path, body) {
  const resp = await fetch(API_BASE + path, {
    method,
    headers: { "X-User-Id": USER_ID, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error ? data.error.message : resp.statusText);
  return data;
}

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k.startsWith("on") ? node.addEventListener(k.slice(2), v) : node.setAttribute(k, v)));
  children.flat().forEach((c) => node.append(c));
  return node;
};

function renderForm(profile) {
  const form = document.getElementById("profile-form");
  form.replaceChildren();
  for (const [field, label, type] of QUESTIONS) {
    const options = type === "bool"
      ? [["", "不确定"], ["true", "是"], ["false", "否"]]
      : [["", "不确定"], ...type.map((v) => [v, v])];
    const select = el("select", { name: field });
    for (const [value, text] of options) select.append(el("option", { value }, text));
    const current = profile[field];
    select.value = current === null || current === undefined ? "" : String(current);
    form.append(el("label", {}, label, select));
  }
}

function readForm() {
  const answers = {};
  for (const [field, , type] of QUESTIONS) {
    const v = document.querySelector(`[name=${field}]`).value;
    answers[field] = v === "" ? null : type === "bool" ? v === "true" : v;
  }
  return answers;
}

let activeTask = null;

async function loadChecklist() {
  const { tasks } = await api("GET", "/api/checklist");
  const box = document.getElementById("checklist");
  box.replaceChildren();
  if (!tasks.length) { box.textContent = "目前没有需要办理的事项。"; return; }
  for (const t of tasks) {
    const pct = Math.round(t.progress * 100);
    const notes = [];
    if (t.blocked_by.length) notes.push(`需先完成：${t.blocked_by.join(", ")}`);
    if (t.maybe_not_applicable) notes.push("可能不再适用");
    box.append(el("div", { class: "task" + (t.id === activeTask ? " active" : ""), onclick: () => openTask(t.id) },
      el("div", {}, el("b", {}, t.title), ` · ${pct}%`),
      el("div", { class: "sub" }, t.reason),
      notes.length ? el("div", { class: "tag" }, notes.join(" · ")) : "",
      el("div", { class: "bar" }, el("div", { style: `width:${pct}%` }))));
  }
}

async function openTask(taskId) {
  activeTask = taskId;
  const task = await api("GET", `/api/tasks/${taskId}`);
  const detail = document.getElementById("detail");
  detail.replaceChildren(el("h2", { style: "margin-top:16px" }, task.title));
  for (const s of task.steps) {
    const box = el("input", { type: "checkbox" });
    box.checked = s.done;
    box.addEventListener("change", async () => {
      await api("PATCH", `/api/tasks/${taskId}/steps/${s.id}`, { done: box.checked });
      loadChecklist();
    });
    const draftBox = el("div");
    detail.append(el("div", { class: "step" },
      el("label", { style: "justify-content:flex-start" }, box, el("b", {}, s.title)),
      s.materials.length ? el("div", { class: "sub" }, "材料：" + s.materials.join("、")) : "",
      ...s.sources.map((src) => el("div", {}, el("a", { href: src.url, target: "_blank" }, src.title || src.url), el("span", { class: "sub" }, ` · 核实于 ${src.verified_at}`))),
      el("button", { class: "ghost", style: "margin-top:6px", onclick: async () => {
        const d = await api("POST", `/api/tasks/${taskId}/steps/${s.id}/dso-draft`, {});
        draftBox.replaceChildren(el("pre", {}, `Subject: ${d.subject}\n\n${d.body}`));
      } }, "帮我问 DSO"),
      draftBox));
  }
  loadChecklist();
}

document.getElementById("save-profile").addEventListener("click", async () => {
  const err = document.getElementById("profile-error");
  err.textContent = "";
  try {
    await api("POST", "/api/profile", { answers: readForm() });
    await loadChecklist();
  } catch (e) { err.textContent = e.message; }
});

document.getElementById("chat-send").addEventListener("click", async () => {
  const input = document.getElementById("chat-input");
  const log = document.getElementById("chat-log");
  const message = input.value.trim();
  if (!message) return;
  log.append(el("div", { class: "msg" }, el("b", {}, "你："), message));
  input.value = "";
  try {
    const { reply } = await api("POST", "/api/chat", { message });
    log.append(el("div", { class: "msg" }, el("b", {}, "助手："), reply));
  } catch (e) { log.append(el("div", { class: "error" }, e.message)); }
});

(async () => {
  const { profile } = await api("GET", "/api/profile");
  renderForm(profile);
  loadChecklist();
})();
</script>
</body>
</html>
