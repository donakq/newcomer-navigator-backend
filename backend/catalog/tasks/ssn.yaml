id: ssn
version: 1
title: Apply for a Social Security Number
when:
  all:
    - {field: has_ssn, eq: false}
    - {field: has_job_offer, eq: true}
reason: You have a job offer but no SSN yet; you need one to get paid.
depends_on: []
personalize_on: [job_type, arrival_date, school]
steps:
  - id: cpt_authorization
    title: Get CPT authorization on your I-20
    when: {field: job_type, eq: CPT}
    materials: [I-20, CPT offer letter]
    sources:
      - {url: "https://example.com/TODO", title: TODO, verified_at: 2026-11-08}
  - id: dso_letter
    title: Request an SSN support letter from your DSO
    materials: [I-20, Job offer letter]
    sources:
      - {url: "https://example.com/TODO", title: TODO, verified_at: 2026-11-08}
  - id: ssa_visit
    title: Apply in person at a Social Security office
    materials: [Passport, I-94, I-20, DSO support letter]
    sources:
      - {url: "https://example.com/TODO", title: TODO, verified_at: 2026-11-08}
